global:
  scrape_interval: 5s
scrape_configs:
  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    scheme: http
    basic_auth:
      username: 'prometheus'
      password: 'secret123'
    static_configs:
      - targets: ['auth-service:8080']
      - targets: ['note-service:8081']